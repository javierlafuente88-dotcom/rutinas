<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor de rutinas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f3f2ef; --surface: #ffffff; --surface-2: #ebeae6; --fg: #1b1c20; --muted: #62646c; --line: #d9d8d3;
  --accent: #c2410c; --accent-fg: #ffffff; --ok: #15803d; --danger: #b91c1c;
  --font-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121316; --surface: #1c1d22; --surface-2: #26272d; --fg: #f1f0ec; --muted: #a2a4ac; --line: #34353c; --accent: #f08a3c; --accent-fg: #1a1208; --ok: #4ade80; --danger: #f87171; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding: 16px 16px 56px; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1 { font-family: var(--font-display); font-size: 40px; line-height: 1; margin: 0; text-transform: uppercase; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 20px; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.field { height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); padding: 0 10px; min-width: 0; width: 100%; }
.btn { height: 44px; padding: 0 16px; border-radius: 10px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font-weight: 600; font-size: 14px; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.solid { background: var(--accent); color: var(--accent-fg); }
.btn.quiet { border-color: var(--line); color: var(--muted); }
.btn.danger { border-color: var(--line); color: var(--danger); }
.btn.wa { background: #1f9d55; border-color: #1f9d55; color: #fff; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.section-label { font-family: var(--font-display); font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.bhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 14px 12px; }
.btitle { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.bcode { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--accent); line-height: 1; }
.bname { font-weight: 600; font-size: 15px; }
.series { display: flex; gap: 4px; justify-content: flex-end; flex-shrink: 0; }
.chip { min-width: 34px; height: 36px; padding: 0 6px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.ex { border-top: 1px solid var(--line); }
.exbtn { width: 100%; display: grid; grid-template-columns: 1fr auto 20px; align-items: center; gap: 10px; background: none; border: 0; padding: 14px; text-align: left; min-height: 56px; }
.exname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.exreps { font-family: var(--font-display); font-size: 22px; font-weight: 600; white-space: nowrap; }
.exreps small { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.caret { width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; justify-self: center; margin-top: -4px; }
.exbtn[aria-expanded="true"] .caret { transform: rotate(225deg); margin-top: 4px; }
.detail { padding: 0 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.media { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; }
.media img { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 16px;
  background: repeating-linear-gradient(135deg, transparent 0 14px, rgba(127,127,127,.08) 14px 28px); }
.ph b { font-family: var(--font-display); font-size: 20px; letter-spacing: .04em; text-transform: uppercase; }
.ph span { font-size: 13px; color: var(--muted); }
.kg { display: flex; align-items: center; gap: 8px; }
.kg label { font-size: 13px; font-weight: 600; color: var(--muted); }
.kg input { width: 88px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); font-size: 18px; padding: 0 10px; text-align: right; }
.cue { color: var(--muted); font-size: 14px; margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 32px 8px; }

body { padding-top: max(16px, env(safe-area-inset-top)); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.lib { display: flex; flex-direction: column; }
.libitem { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.libitem:first-child { border-top: 0; }
.thumb { width: 56px; height: 42px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; flex-shrink: 0; display: grid; place-items: center; font-size: 10px; color: var(--muted); text-align: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.libname { font-weight: 600; min-width: 0; flex: 1; overflow-wrap: anywhere; }
.libname small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.bedit { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.bgrid { display: grid; grid-template-columns: 64px 1fr 72px; gap: 8px; }
.lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 4px; }
.exedit { display: grid; grid-template-columns: 1fr 64px; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.exedit .full { grid-column: 1 / -1; }
.exedit .opts { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.chk { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.x { height: 36px; border: 0; background: none; color: var(--danger); font-weight: 600; font-size: 13px; padding: 0 4px; }
.linkbox { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; overflow-wrap: anywhere; max-height: 110px; overflow: auto; }
.steps { margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function slug(n) { return String(n).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "ejercicio"; }
function b64u(bytes) { var s = ""; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function unb64u(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function pipe(bytes, stream) { var r = new Response(new Blob([bytes]).stream().pipeThrough(stream)); return new Uint8Array(await r.arrayBuffer()); }
/* Rutina -> texto corto para el link. Prefijo z = comprimido, p = sin comprimir. */
async function encodeRoutine(obj) {
  var bytes = new TextEncoder().encode(JSON.stringify(obj));
  try { if (typeof CompressionStream !== "undefined") return "z" + b64u(await pipe(bytes, new CompressionStream("deflate-raw"))); } catch (e) {}
  return "p" + b64u(bytes);
}
async function decodeRoutine(s) {
  var kind = s.charAt(0), bytes = unb64u(s.slice(1));
  if (kind === "z") bytes = await pipe(bytes, new DecompressionStream("deflate-raw"));
  return JSON.parse(new TextDecoder().decode(bytes));
}

var DEFAULTS = ["Carpa","Spider","90-90","Cat camel","Copa","Split rotación","Glúteos marcha lateral","Swing de cadera","Soga","Press plano","Cuádriceps camilla","Vuelos posteriores","Tríceps polea","Puente lateral"];
function ls(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

var extra = ls("ed-extra", []);               // ejercicios agregados por el profe
var base = ls("ed-base", "");                 // dirección de la página publicada
function library() { return DEFAULTS.concat(extra).map(function (n) { return { id: slug(n), name: n }; }); }
function nm(id) { var l = library().filter(function (x) { return x.id === id; })[0]; return l ? l.name : id; }
function ex(name, reps, o) { o = o || {}; return { id: slug(name), reps: reps, lado: !!o.lado, kg: !!o.kg, seg: !!o.seg, cue: o.cue || "" }; }

var S = ls("ed-rutina", null) || {
  titulo: "Sesión de fuerza", dia: "Día 1",
  blocks: [
    { code: "A1", name: "Movilidad", series: 1, section: "Movilidad y activación", ex: [ex("Carpa", "10"), ex("Spider", "5", { lado: 1 }), ex("90-90", "10", { lado: 1 }), ex("Cat camel", "10")] },
    { code: "A2", name: "Activación", series: 3, section: "", ex: [ex("Copa", "6"), ex("Split rotación", "5", { lado: 1 }), ex("Glúteos marcha lateral", "6", { lado: 1 })] },
    { code: "B1", name: "Cadera y core", series: 4, section: "Parte principal", ex: [ex("Swing de cadera", "8"), ex("Soga", "12", { seg: 1 })] },
    { code: "B2", name: "Empuje", series: 5, section: "", ex: [ex("Press plano", "8", { kg: 1 })] },
    { code: "B3", name: "Piernas", series: 5, section: "", ex: [ex("Cuádriceps camilla", "8", { lado: 1, kg: 1 })] },
    { code: "B4", name: "Complemento", series: 3, section: "", ex: [ex("Vuelos posteriores", "8", { kg: 1 }), ex("Tríceps polea", "8", { lado: 1, kg: 1, cue: "Variante skiador." }), ex("Puente lateral", "8", { lado: 1, cue: "Subo y bajo." })] }
  ]
};
var link = "", hash = "", copied = false;
var app = document.getElementById("app");
function persist() { lsSet("ed-rutina", S); link = ""; }

function opts(sel) { return library().map(function (l) { return '<option value="' + esc(l.id) + '"' + (l.id === sel ? " selected" : "") + ">" + esc(l.name) + "</option>"; }).join(""); }

function payload() {
  return { t: S.titulo, d: S.dia, b: S.blocks.map(function (b) { return { c: b.code, n: b.name, s: b.series, sec: b.section, e: b.ex.map(function (e) { return { i: e.id, n: nm(e.id), r: e.reps, l: e.lado ? 1 : 0, k: e.kg ? 1 : 0, u: e.seg ? 1 : 0, c: e.cue }; }) }; }) };
}
function cleanBase(b) { return b.trim().replace(/#.*$/, "").replace(/\/index\.html$/i, "").replace(/\/+$/, ""); }

function render() {
  var h = '<div><div class="eyebrow">Para el profe</div><h1>Editor de rutinas</h1></div>';
  h += '<div class="card"><h2>Rutina de la semana</h2><div class="row"><label class="lbl grow">Título<input class="field" data-f="titulo" value="' + esc(S.titulo) + '"></label><label class="lbl" style="width:110px">Día<input class="field" data-f="dia" value="' + esc(S.dia) + '"></label></div></div>';
  S.blocks.forEach(function (b, bi) {
    h += '<div class="bedit"><div class="bgrid"><label class="lbl">Bloque<input class="field" data-b="' + bi + '" data-k="code" value="' + esc(b.code) + '"></label>'
      + '<label class="lbl">Nombre<input class="field" data-b="' + bi + '" data-k="name" value="' + esc(b.name) + '"></label>'
      + '<label class="lbl">Series<input class="field" type="number" min="1" max="10" inputmode="numeric" data-b="' + bi + '" data-k="series" value="' + b.series + '"></label></div>'
      + '<label class="lbl">Título de sección (opcional)<input class="field" data-b="' + bi + '" data-k="section" placeholder="Ej: Parte principal" value="' + esc(b.section) + '"></label>';
    b.ex.forEach(function (e, ei) {
      var a = 'data-b="' + bi + '" data-e="' + ei + '"';
      h += '<div class="exedit"><select class="field" ' + a + ' data-k="id" aria-label="Ejercicio">' + opts(e.id) + '</select>'
        + '<input class="field" ' + a + ' data-k="reps" value="' + esc(e.reps) + '" inputmode="numeric" aria-label="Repeticiones">'
        + '<input class="field full" ' + a + ' data-k="cue" placeholder="Nota (opcional), ej: Subo y bajo" value="' + esc(e.cue) + '">'
        + '<div class="opts"><label class="chk"><input type="checkbox" ' + a + ' data-k="lado"' + (e.lado ? " checked" : "") + '> Por lado</label>'
        + '<label class="chk"><input type="checkbox" ' + a + ' data-k="kg"' + (e.kg ? " checked" : "") + '> Pide kilos</label>'
        + '<label class="chk"><input type="checkbox" ' + a + ' data-k="seg"' + (e.seg ? " checked" : "") + '> Segundos</label>'
        + '<button type="button" class="x" data-rmex="' + bi + ":" + ei + '">Quitar</button></div></div>';
    });
    h += '<div class="row"><button type="button" class="btn" data-addex="' + bi + '">+ Ejercicio</button><button type="button" class="btn danger" data-rmb="' + bi + '">Borrar bloque</button></div></div>';
  });
  h += '<button type="button" class="btn" data-addb="1">+ Agregar bloque</button>';
  h += '<button type="button" class="btn quiet" data-reset="1">Empezar una rutina en blanco</button>';

  h += '<div class="card"><h2>Mandar al alumno</h2>'
    + '<label class="lbl">Dirección de tu página (la pegás una sola vez)<input id="base" class="field" data-base="1" inputmode="url" placeholder="https://mi-rutina.netlify.app" value="' + esc(base) + '"></label>'
    + '<button type="button" class="btn solid" data-gen="1">Generar link de la rutina</button>';
  if (link && !cleanBase(base)) {
    h += '<p class="note">Para mandarlo por WhatsApp falta pegar arriba la dirección de tu página. Mientras tanto podés ver la vista previa.</p><a class="btn quiet" target="_blank" href="index.html#' + hash + '">Ver cómo lo ve el alumno</a>';
  } else if (link) {
    h += '<div class="linkbox" id="linkbox">' + esc(link) + '</div><div class="row">'
      + '<button type="button" class="btn grow" data-copy="1">' + (copied ? "Copiado" : "Copiar link") + '</button>'
      + '<a class="btn wa grow" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(S.titulo + " (" + S.dia + "): " + link) + '">WhatsApp</a></div>'
      + '<a class="btn quiet" target="_blank" href="index.html#' + hash + '">Ver cómo lo ve el alumno</a>';
  } else if (!base) {
    h += '<p class="note">Todavía no pegaste la dirección. Podés generar el link igual y ver la vista previa.</p>';
  }
  h += "</div>";

  h += '<div class="card"><h2>Biblioteca de ejercicios</h2><p class="note">El GIF de cada ejercicio va en la carpeta <b>gifs</b>, con el nombre que aparece abajo de cada uno.</p><div class="lib">';
  library().forEach(function (l) {
    h += '<div class="libitem"><div class="thumb"><img src="gifs/' + esc(l.id) + '.gif" alt="" onerror="this.parentNode.textContent=\'falta GIF\'"></div><div class="libname">' + esc(l.name) + '<small>gifs/' + esc(l.id) + '.gif</small></div></div>';
  });
  h += '</div><div class="row"><input id="newex" class="field grow" placeholder="Ejercicio nuevo, ej: Remo con barra"><button type="button" class="btn" data-newex="1">Agregar</button></div></div>';
  app.innerHTML = h;
}

async function gen() {
  hash = await encodeRoutine(payload());
  var b = cleanBase(base);
  link = (b ? b + "/" : "") + "#" + hash;
  if (!b) link = "(pegá arriba la dirección de tu página)#" + hash.slice(0, 12) + "…";
  copied = false; render();
}

app.addEventListener("click", function (ev) {
  var t = ev.target.closest("button"); if (!t) return; var d = t.dataset;
  if (d.gen) { var bi = document.getElementById("base"); if (bi) { base = bi.value; lsSet("ed-base", base); } gen(); return; }
  if (d.copy) {
    var full = cleanBase(base) ? cleanBase(base) + "/#" + hash : link;
    var ok = function () { copied = true; render(); };
    try { navigator.clipboard.writeText(full).then(ok, function () { sel(); }); } catch (e) { sel(); }
    return;
  }
  if (d.addb) { S.blocks.push({ code: "B" + (S.blocks.length + 1), name: "Nuevo bloque", series: 3, section: "", ex: [ex(DEFAULTS[0], "10")] }); persist(); render(); return; }
  if (d.rmb) { S.blocks.splice(+d.rmb, 1); persist(); render(); return; }
  if (d.addex) { S.blocks[+d.addex].ex.push(ex(DEFAULTS[0], "10")); persist(); render(); return; }
  if (d.rmex) { var q = d.rmex.split(":"); S.blocks[+q[0]].ex.splice(+q[1], 1); persist(); render(); return; }
  if (d.reset) { S.titulo = "Nueva rutina"; S.dia = ""; S.blocks = [{ code: "A1", name: "Bloque 1", series: 3, section: "", ex: [ex(DEFAULTS[0], "10")] }]; persist(); render(); return; }
  if (d.newex) {
    var v = document.getElementById("newex").value.trim();
    if (v && library().every(function (l) { return l.id !== slug(v); })) { extra.push(v); lsSet("ed-extra", extra); render(); }
  }
});
function sel() { var b = document.getElementById("linkbox"); if (b) { var r = document.createRange(); r.selectNodeContents(b); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
app.addEventListener("change", function (ev) {
  var el = ev.target, d = el.dataset;
  if (d.base) { base = el.value; lsSet("ed-base", base); return; }
  if (d.f) { S[d.f] = el.value; persist(); render(); return; }
  if (d.b != null && d.k) {
    var b = S.blocks[+d.b], tgt = d.e != null ? b.ex[+d.e] : b, val = el.type === "checkbox" ? el.checked : el.value;
    if (d.k === "series") val = Math.max(1, Math.min(10, parseInt(val, 10) || 1));
    tgt[d.k] = val; persist(); render();
  }
});
render();
</script>
</body>
</html>
