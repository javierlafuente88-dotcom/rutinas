<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach Luciano Villafane · Rutinas</title>
<meta name="description" content="Tu rutina de entrenamiento con el GIF de cada ejercicio.">
<meta property="og:title" content="Coach Luciano Villafane · Tu rutina de entrenamiento">
<meta property="og:image" content="https://javierlafuente88-dotcom.github.io/rutinas/prueba/coach.jpg">
<meta property="og:description" content="Tu rutina con el GIF de cada ejercicio. Tocá el link y empezá a entrenar.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f2ef;--surface:#fff;--surface-2:#ebeae6;--fg:#1b1c20;--muted:#62646c;--line:#d9d8d3;--accent:#c2410c;--accent-fg:#fff;--ok:#15803d;--danger:#b91c1c;--warn:#b45309;
  --font-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--surface:#1c1d22;--surface-2:#26272d;--fg:#f1f0ec;--muted:#a2a4ac;--line:#34353c;--accent:#f08a3c;--accent-fg:#1a1208;--ok:#4ade80;--danger:#f87171;--warn:#fbbf24;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.4;padding:16px 16px 60px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
h1{font-family:var(--font-display);font-size:38px;line-height:1;margin:0;text-transform:uppercase}
h2{font-family:var(--font-display);font-size:20px;letter-spacing:.08em;text-transform:uppercase;margin:0}
.head{display:flex;gap:14px;align-items:center}
.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 25%;border:3px solid var(--accent);flex-shrink:0;background:var(--surface-2)}
.head h1{font-size:34px}
.marca{font-family:var(--font-display);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.note{margin:0;font-size:13px;color:var(--muted)}
.field{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;min-width:0;width:100%}
textarea.field{height:170px;padding:10px;resize:vertical;font-size:14px;line-height:1.35}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap}
.btn.solid{background:var(--accent);color:var(--accent-fg)}.btn.quiet{border-color:var(--line);color:var(--muted)}.btn.danger{border-color:var(--line);color:var(--danger)}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.sm{height:34px;padding:0 10px;font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grow{flex:1;min-width:0}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;height:44px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.18)}
.hide{display:none!important}
/* editor */
.bedit{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.bgrid{display:grid;grid-template-columns:64px 1fr 72px;gap:8px}
.exedit{display:grid;grid-template-columns:56px 1fr 78px;gap:8px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.exedit .opts{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
.exedit label.chk{display:inline-flex;align-items:center;gap:6px;min-height:34px}
.exedit input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--surface-2);border:1.5px dashed var(--line);overflow:hidden;display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center;padding:0;cursor:pointer}
.thumb.ok{border-style:solid}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.x{border:0;background:none;color:var(--danger);font-weight:600;font-size:13px;padding:0 4px;height:34px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.tag.warn{color:var(--warn)}.tag.good{color:var(--ok)}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px;overflow-wrap:anywhere;max-height:84px;overflow:auto}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
ol.steps{padding-left:20px;margin:8px 0;line-height:1.55;font-size:14px}code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:13px}
/* picker */
#picker{position:fixed;inset:0;background:rgb(0 0 0/.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#picker .sheet{background:var(--surface);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:4px;display:flex;flex-direction:column;gap:4px;text-align:center;font-size:11px;word-break:break-word}
.pick .m{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface-2)}.pick .m img,.pick .m video{width:100%;height:100%;object-fit:cover}
/* alumno */
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.section-label{font-family:var(--font-display);font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 12px}
.btitle{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}.bcode{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--accent);line-height:1}.bname{font-weight:600;font-size:15px}
.series{display:flex;gap:4px;justify-content:flex-end;flex-shrink:0}
.chip{min-width:34px;height:36px;padding:0 6px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ex{border-top:1px solid var(--line)}
.exbtn{width:100%;display:grid;grid-template-columns:1fr auto 20px;align-items:center;gap:10px;background:none;border:0;padding:14px;text-align:left;min-height:56px}
.exname{font-weight:600;min-width:0;overflow-wrap:anywhere}.exreps{font-family:var(--font-display);font-size:22px;font-weight:600;white-space:nowrap}
.caret{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;justify-self:center;margin-top:-4px}
.exbtn[aria-expanded="true"] .caret{transform:rotate(225deg);margin-top:4px}
.detail{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.media{position:relative;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line);display:grid;place-items:center;max-height:62vh}
.media img,.media video{width:100%;max-height:62vh;object-fit:contain;display:block}
.ph{padding:30px 16px;text-align:center;color:var(--muted);background:var(--surface-2);width:100%}
.kg{display:flex;align-items:center;gap:10px}.kg input{width:110px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;font-size:18px}
.cue{margin:0;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><img class="avatar" src="coach.jpg" alt="" onerror="this.style.display='none'"><div><div class="marca" id="marca"></div><div class="eyebrow" id="eyebrow">Armado de rutinas</div><h1 id="title">Rutinas del Profe</h1></div></div>
  <div class="tabs" id="tabs">
    <button id="tEd" aria-selected="true" onclick="go('ed')">1 · Editor del profe</button>
    <button id="tAl" aria-selected="false" onclick="go('al')">2 · Lo que ve el alumno</button>
  </div>
  <div id="view" class="wrap" style="gap:16px"></div>
</div>
<div id="picker" class="hide" onclick="if(event.target===this)cerrarPicker()"><div class="sheet" id="sheet"></div></div>

<script>
/* ================= Configuración ================= */
const MARCA_DEFAULT = "Coach Luciano Villafane";   // nombre que aparece en la rutina y en el mensaje
const PLANILLA_URL = "https://script.google.com/macros/s/AKfycbygv213kdu1MhmmX-DC7kxqQZzy972pWUebV0M5XnkeeJDFL4KA1BgRTRZv163bZE5k/exec";   // opcional: pegá acá el link /exec y los links salen todavía más cortos
const GIFS_MANUAL = ["soga-viborita.mp4"];   // se usa solo si GitHub no devuelve la lista de archivos
const host = location.hostname.endsWith("github.io");
const OWNER = host ? location.hostname.split(".")[0] : "javierlafuente88-dotcom";
const REPO  = host ? (location.pathname.split("/")[1] || "rutinas") : "rutinas";
const DIR   = host ? location.pathname.split("/").slice(2,-1).join("/") : "";
const GIFDIR = (DIR ? DIR + "/" : "") + "gifs";

/* ================= Utilidades ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\.(gif|mp4|webm|mov)$/,"").replace(/[^a-z0-9]+/g," ").trim();
const esVideo = f => /\.(mp4|webm|mov)$/i.test(f);
const src = f => "gifs/" + encodeURIComponent(f);
const media = (f,cls) => esVideo(f)
  ? `<video ${cls?`class="${cls}"`:""} src="${src(f)}" autoplay loop muted playsinline></video>`
  : `<img ${cls?`class="${cls}"`:""} src="${src(f)}" alt="">`;
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));
const lsGet = (k,d) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };

/* ================= Estado ================= */
let files = [];                                  // archivos disponibles en gifs/
let mem = lsGet("rp_mem", {});                   // nombre de ejercicio -> archivo (lo que el profe ya eligió antes)
let S = lsGet("rp_state", {titulo:"", alumno:"", url:"", blocks:[]});
if(!S.marca) S.marca = MARCA_DEFAULT;
let modo = "ed", abierto = null, pick = null, P = {done:{}, kg:{}};
const guardar = () => lsSet("rp_state", S);

/* ================= Parser del plan del profe ================= */
function parsearPlan(txt){
  const lines = txt.replace(/[⁠​‎‏﻿]/g,"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out = {titulo:"", blocks:[]}; let cur = null;
  for(const raw of lines){
    const l = raw.replace(/^[*•·\-–]+\s*/,"").replace(/^\d+[.)]\s+/,"").replace(/\s+/g," ").trim();
    let m;
    if((m = l.match(/^(?:bloque\s*(\d+)|([a-z])\s*(\d+))$/i))){
      cur = {code: m[1] ? "B"+m[1] : m[2].toUpperCase()+m[3], name:"", series:0, ex:[]};
      out.blocks.push(cur); continue;
    }
    if((m = l.match(/^x\s*(\d+)\s*series?$/i))){ if(cur) cur.series = +m[1]; continue; }
    if((m = l.match(/^(.+?)\s+x\s*(\d+(?:\s*\/\s*\d+)?)\s*(seg|segs|segundos|min|minutos)?\.?$/i)) && cur){
      cur.ex.push({n:m[1].trim(), r:m[2].replace(/\s/g,""), u:(m[3]||"").toLowerCase(), f:"", kg:false, cue:""}); continue;
    }
    if(!cur && !out.titulo){ out.titulo = l; continue; }
    if(cur){ cur.name = cur.name ? cur.name+" · "+l : l; }
  }
  out.blocks.forEach(b=>{ if(!b.series){ b.series = 1; b.revisar = true; } });
  return out;
}

/* ================= Emparejar ejercicio con su GIF ================= */
function buscarArchivo(nombre){
  const n = norm(nombre);
  if(mem[n] && files.some(f=>f.f===mem[n])) return mem[n];
  let best = "", bestScore = 0;
  const tn = n.split(" ").filter(t=>t.length>2);
  for(const f of files){
    const fn = f.k; if(!fn) continue;
    let s = 0;
    if(fn===n) s = 100;
    else if(fn.length>=3 && (" "+n+" ").includes(" "+fn+" ")) s = 60 + fn.length;
    else if(fn.length>=4 && n.includes(fn)) s = 50 + fn.length;
    else if(n.length>=4 && fn.includes(n)) s = 45 + n.length;
    else {
      const tf = fn.split(" ").filter(t=>t.length>2);
      const shared = tn.filter(t=>tf.includes(t)).length;
      if(shared && shared/Math.min(tn.length,tf.length) >= 0.6) s = 20 + shared;
    }
    if(s > bestScore){ bestScore = s; best = f.f; }
  }
  return best;
}
function reemparejar(soloVacios){
  S.blocks.forEach(b=>b.ex.forEach(e=>{ if(!soloVacios || !e.f) e.f = buscarArchivo(e.n); }));
}

/* ================= Lista de archivos de gifs/ ================= */
async function cargarArchivos(){
  let nombres = GIFS_MANUAL, origen = "lista manual";
  try{
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${GIFDIR}`);
    if(!r.ok) throw 0;
    nombres = (await r.json()).filter(x=>/\.(gif|mp4|webm|mov)$/i.test(x.name)).map(x=>x.name);
    origen = "GitHub";
  }catch(e){}
  files = nombres.sort().map(f=>({f, k:norm(f)}));
  files.origen = origen;
}

/* ================= EDITOR ================= */
function vistaEditor(){
  const sinGif = S.blocks.reduce((a,b)=>a+b.ex.filter(e=>!e.f).length,0);
  const total = S.blocks.reduce((a,b)=>a+b.ex.length,0);
  let h = `
  <div class="card">
    <h2>1. Pegá el plan del profe</h2>
    <p class="note">Copiá el texto tal cual lo mandás por WhatsApp y pegalo acá. La app arma los bloques y busca el GIF de cada ejercicio.</p>
    <textarea id="plan" class="field" placeholder="PLAN DE ENTRENAMIENTO&#10;&#10;A 1&#10;* CARPA X 10&#10;* SPIDERMAN X 5/5&#10;X 1 SERIE&#10;&#10;BLOQUE 1&#10;1. FRENO EN ESTOCADA X 2/2&#10;X 3 SERIES"></textarea>
    <div class="row"><button class="btn solid grow" onclick="armar()">Armar rutina</button></div>
  </div>
  <div class="card">
    <h2>2. Datos de la rutina</h2>
    <label class="lbl">Tu marca (aparece en la rutina y en el mensaje)<input class="field" data-f="marca" value="${esc(S.marca)}"></label>
    <div class="row"><label class="lbl grow">Título<input class="field" data-f="titulo" value="${esc(S.titulo)}"></label>
    <label class="lbl grow">Alumno<input class="field" data-f="alumno" value="${esc(S.alumno)}" placeholder="Ej: Marcos"></label></div>
  </div>`;
  if(total){
    h += `<div class="row"><span class="tag ${sinGif?"warn":"good"}">${total-sinGif} de ${total} con GIF</span>${sinGif?`<span class="note">Tocá el recuadro de un ejercicio para elegirle el GIF.</span>`:""}</div>`;
  }
  S.blocks.forEach((b,bi)=>{
    h += `<div class="bedit"><div class="bgrid">
      <label class="lbl">Bloque<input class="field" data-b="${bi}" data-k="code" value="${esc(b.code)}"></label>
      <label class="lbl">Detalle<input class="field" data-b="${bi}" data-k="name" value="${esc(b.name)}" placeholder="Ej: EMOM 5 minutos"></label>
      <label class="lbl">Series<input class="field" type="number" min="1" max="10" inputmode="numeric" data-b="${bi}" data-k="series" value="${b.series}"></label></div>
      ${b.revisar?`<span class="tag warn">El plan no decía las series: revisalas</span>`:""}`;
    b.ex.forEach((e,ei)=>{
      h += `<div class="exedit">
        <button class="thumb ${e.f?"ok":""}" onclick="abrirPicker(${bi},${ei})" aria-label="Elegir GIF">${e.f?media(e.f,""):"sin GIF<br>elegir"}</button>
        <input class="field" data-b="${bi}" data-e="${ei}" data-k="n" value="${esc(e.n)}" aria-label="Ejercicio">
        <input class="field" data-b="${bi}" data-e="${ei}" data-k="r" value="${esc(e.r)}" inputmode="text" aria-label="Repeticiones">
        <div class="opts"><label class="chk"><input type="checkbox" data-b="${bi}" data-e="${ei}" data-k="kg" ${e.kg?"checked":""}> Pide kilos</label>
        <button class="x" onclick="quitarEj(${bi},${ei})">Quitar</button></div></div>`;
    });
    h += `<div class="row"><button class="btn sm" onclick="sumarEj(${bi})">+ Ejercicio</button>
      <button class="btn sm danger" onclick="quitarBloque(${bi})">Borrar bloque</button></div></div>`;
  });
  if(S.blocks.length) h += `<div class="row"><button class="btn quiet grow" onclick="sumarBloque()">+ Agregar bloque</button><button class="btn quiet grow" onclick="pedirKilos()">Pedir kilos en todos</button></div>`;

  h += `
  <div class="card">
    <h2>3. Mandar al alumno</h2>
    <button class="btn solid" id="btnLink" onclick="mostrarLink()">Generar link de la rutina</button>
    <div id="linkArea"></div>
  </div>
  <div class="card">
    <h2>Conexión con la planilla</h2>
    <label class="lbl">Link de la planilla (termina en /exec)<input class="field" data-f="url" value="${esc(S.url)}" placeholder="https://script.google.com/macros/s/.../exec"></label>
    <p class="note">Con esto cargado, los links a los alumnos salen cortos (con tu rutina guardada en la planilla) y el alumno ve el botón "Enviar mi progreso", que llega a tu planilla.</p>
  </div>
  <div class="card">
    <h2>Tus GIFs y videos</h2>
    <p class="note">${files.length} archivo${files.length===1?"":"s"} en la carpeta (${files.origen||"lista manual"}).</p>
    <details><summary>Cómo subir GIFs nuevos</summary>
      <ol class="steps">
        <li>Entrá a GitHub, abrí el repositorio <code>rutinas</code> y la carpeta <code>gifs</code>.</li>
        <li>Tocá <b>Add file → Upload files</b> y soltá <b>todos los GIFs o videos juntos</b>.</li>
        <li>Tocá <b>Commit changes</b> y esperá 2 minutos.</li>
        <li>Volvé acá, recargá y tocá <b>Armar rutina</b>: los ejercicios con el mismo nombre se emparejan solos. Los que no, los elegís una vez tocando el recuadro, y la app se acuerda para la próxima.</li>
      </ol>
      <p class="note">No hace falta renombrar los archivos. Igual, si se llaman como el ejercicio (<code>carpa.gif</code>, <code>peso-muerto.mp4</code>), el emparejado es automático.</p>
    </details>
  </div>`;
  return h;
}

function armar(){
  const txt = $("plan").value.trim(); if(!txt){ alert("Pegá primero el plan."); return; }
  const r = parsearPlan(txt);
  if(!r.blocks.length){ alert("No encontré bloques. Revisá que el texto tenga líneas como 'A 1' o 'BLOQUE 1'."); return; }
  S.blocks = r.blocks; if(r.titulo) S.titulo = r.titulo;
  reemparejar(false); guardar(); render(); window.scrollTo(0,0);
}
function sumarBloque(){ S.blocks.push({code:"B"+(S.blocks.length+1),name:"",series:3,ex:[{n:"",r:"10",u:"",f:"",kg:false,cue:""}]}); guardar(); render(); }
function quitarBloque(i){ if(confirm("¿Borrar el bloque?")){ S.blocks.splice(i,1); guardar(); render(); } }
function sumarEj(i){ S.blocks[i].ex.push({n:"",r:"10",u:"",f:"",kg:false,cue:""}); guardar(); render(); }
function quitarEj(b,e){ S.blocks[b].ex.splice(e,1); guardar(); render(); }
function pedirKilos(){ S.blocks.forEach(b=>b.ex.forEach(e=>e.kg=true)); guardar(); render(); }

function abrirPicker(b,e){
  pick = {b,e}; const ex = S.blocks[b].ex[e];
  let h = `<div class="row" style="justify-content:space-between"><h2>${esc(ex.n||"Ejercicio")}</h2><button class="btn sm quiet" onclick="cerrarPicker()">Cerrar</button></div>
    <p class="note">Tocá el GIF que corresponde. La app se acuerda para la próxima vez.</p><div class="grid">`;
  h += `<button class="pick" onclick="elegir('')"><div class="m" style="display:grid;place-items:center;color:var(--muted)">Sin GIF</div></button>`;
  files.forEach((f,i)=>{ h += `<button class="pick" onclick="elegir(${i})"><div class="m">${media(f.f,"")}</div>${esc(f.f.replace(/\.(gif|mp4|webm|mov)$/i,""))}</button>`; });
  $("sheet").innerHTML = h + "</div>"; $("picker").classList.remove("hide");
}
function cerrarPicker(){ $("picker").classList.add("hide"); pick = null; }
function elegir(i){
  if(!pick) return; const ex = S.blocks[pick.b].ex[pick.e];
  const f = i==="" ? "" : files[i].f; ex.f = f;
  if(f) mem[norm(ex.n)] = f; else delete mem[norm(ex.n)];
  lsSet("rp_mem", mem); guardar(); cerrarPicker(); render();
}

/* ---------- Link ---------- */
function payload(){
  return {m:S.marca, t:S.titulo, a:S.alumno, u:S.url, b:S.blocks.map(b=>[b.code,b.name,b.series,b.ex.map(e=>[e.n,e.r,e.u||"",e.f||"",e.kg?1:0,e.cue||""])])};
}
function desdePayload(o){
  return {marca:o.m||MARCA_DEFAULT, titulo:o.t||"", alumno:o.a||"", url:o.u||"",
    blocks:o.b.map(b=>({code:b[0],name:b[1],series:b[2],ex:b[3].map(e=>({n:e[0],r:e[1],u:e[2],f:e[3],kg:!!e[4],cue:e[5]}))}))};
}
const b64u = bytes => { let t=""; bytes.forEach(x=>t+=String.fromCharCode(x)); return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const unb64u = t => Uint8Array.from(atob(t.replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0));
async function bytesDe(stream){ return new Uint8Array(await new Response(stream).arrayBuffer()); }
async function linkLargo(){                      // sin planilla: toda la rutina viaja dentro del link, comprimida
  const base = location.origin + location.pathname, json = JSON.stringify(payload());
  if(typeof CompressionStream !== "undefined"){
    const cs = new CompressionStream("deflate-raw"), w = cs.writable.getWriter();
    w.write(new TextEncoder().encode(json)); w.close();
    return base + "#z=" + b64u(await bytesDe(cs.readable));
  }
  return base + "#r=" + enc(payload());
}
const planillaBase = () => PLANILLA_URL || S.url;
const deployId = u => (u.split("/s/")[1]||"").split("/")[0];
const urlDeploy = id => "https://script.google.com/macros/s/" + id + "/exec";
const nuevoId = () => Array.from({length:6},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*31)]).join("");
async function existeRutina(base,id){ try{ const r = await fetch(base+"?id="+id); const j = await r.json(); return !!j.ok; }catch(e){ return false; } }

let linkActual = "";
async function mostrarLink(){
  const area = $("linkArea");
  if(!S.blocks.length){ area.innerHTML = '<p class="note">Armá primero la rutina.</p>'; return; }
  area.innerHTML = '<p class="note">Generando el link, esperá unos segundos...</p>';
  const bt = $("btnLink"); if(bt){ bt.disabled = true; bt.textContent = "Generando..."; }
  area.scrollIntoView({behavior:"smooth", block:"center"});
  let link = "", aviso = ""; const base = planillaBase();
  if(base && /^https:\/\/script\.google\.com\//.test(base)){
    const id = nuevoId();
    try{
      await fetch(base,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({accion:"guardarRutina", id, alumno:S.alumno, rutina:S.titulo, datos:payload()})});
      let ok = false;
      for(let i=0;i<3 && !ok;i++){ await new Promise(r=>setTimeout(r,1200)); ok = await existeRutina(base,id); }
      if(ok) link = location.origin + location.pathname + "#c=" + id + (PLANILLA_URL ? "" : "@" + deployId(base));
      else aviso = "No pude guardar la rutina en la planilla. Falta actualizar el script de Google. Por ahora te dejo el link largo.";
    }catch(e){ aviso = "No hay conexión con la planilla. Te dejo el link largo."; }
  }
  if(!link) link = await linkLargo();
  linkActual = link;
  const msg = `Hola${S.alumno?" "+S.alumno:""}! Te paso tu rutina${S.titulo?" ("+S.titulo+")":""} con el GIF de cada ejercicio:\n${link}\n\n— ${S.marca}`;
  area.innerHTML = `${aviso?`<p class="note" style="color:var(--warn)">${esc(aviso)}</p>`:`<span class="tag good">${link.includes("#c=")?"Link corto":"Link completo"}</span>`}
    <div class="linkbox">${esc(link)}</div>
    <div class="row" style="margin-top:8px"><button class="btn grow" onclick="copiar()">Copiar link</button>
    <a class="btn wa grow" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">WhatsApp</a></div>
    <button class="btn quiet" style="margin-top:8px;width:100%" onclick="go('al')">Ver cómo lo ve el alumno</button>`;
  if(bt){ bt.disabled = false; bt.textContent = "Generar link de la rutina"; }
  area.scrollIntoView({behavior:"smooth", block:"center"});
}
function copiar(){ navigator.clipboard.writeText(linkActual).then(()=>alert("Link copiado. Pegalo en WhatsApp.")); }

/* ================= ALUMNO ================= */
const claveProg = () => "rp_prog_" + norm(S.alumno) + "_" + norm(S.titulo);
function vistaAlumno(){
  P = lsGet(claveProg(), {done:{}, kg:{}});
  let total = 0, hechas = 0, h = "";
  S.blocks.forEach(b=>{ total += b.series; hechas += Math.min(P.done[b.code]||0, b.series); });
  h += `<div class="bar"><i style="width:${total?hechas/total*100:0}%"></i></div><div class="note" style="margin-top:-8px">${hechas} de ${total} series hechas</div>`;
  S.blocks.forEach(b=>{
    const d = Math.min(P.done[b.code]||0, b.series);
    h += `<section class="block"><div class="bhead"><div class="btitle"><span class="bcode">${esc(b.code)}</span><span class="bname">${esc(b.name)}</span></div><div class="series">`;
    for(let i=1;i<=b.series;i++) h += `<button class="chip" aria-pressed="${i<=d}" onclick="serie('${esc(b.code)}',${i})">${b.series===1?"Hecha":i}</button>`;
    h += `</div></div>`;
    b.ex.forEach((e,ei)=>{
      const key = b.code+"_"+ei, open = abierto===key;
      h += `<div class="ex"><button class="exbtn" aria-expanded="${open}" onclick="abrir('${key}')"><span class="exname">${esc(e.n)}</span><span class="exreps">${esc(e.r)}${e.u?` <small style="font-size:12px;color:var(--muted)">${esc(e.u)}</small>`:""}</span><span class="caret"></span></button>`;
      if(open){
        h += `<div class="detail"><div class="media">${e.f?media(e.f,""):`<div class="ph"><b>${esc(e.n)}</b><br>Sin GIF todavía</div>`}</div>`;
        if(e.cue) h += `<p class="cue">${esc(e.cue)}</p>`;
        if(e.kg) h += `<div class="kg"><label for="kg${key}">Carga</label><input id="kg${key}" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0" value="${esc(P.kg[key]||"")}" oninput="kilos('${key}',this.value)"><b>kg</b></div>`;
        h += `</div>`;
      }
      h += `</div>`;
    });
    h += `</section>`;
  });
  h += `<div class="card"><button class="btn solid" style="width:100%" onclick="enviar()">Enviar mi progreso al profe</button><p id="estado" class="note" style="text-align:center;margin:0"></p></div>
  <p class="note" style="text-align:center;letter-spacing:.12em;text-transform:uppercase">${esc(S.marca)}</p>`;
  return h;
}
function serie(code,n){ P.done[code] = (P.done[code]||0)===n ? n-1 : n; lsSet(claveProg(),P); render(); }
function abrir(k){ abierto = abierto===k ? null : k; render(); }
function kilos(k,v){ P.kg[k] = v; lsSet(claveProg(),P); }
async function enviar(){
  const est = $("estado");
  if(!S.url){ est.textContent = "Tu profe todavía no conectó la planilla."; return; }
  const ejercicios = [];
  S.blocks.forEach(b=>b.ex.forEach((e,ei)=>ejercicios.push({nombre:e.n, hechas:Math.min(P.done[b.code]||0,b.series), pedidas:b.series, kg:P.kg[b.code+"_"+ei]||""})));
  est.textContent = "Enviando...";
  try{
    await fetch(S.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({alumno:S.alumno, rutina:S.titulo, ejercicios})});
    est.textContent = "✅ Enviado. ¡Buen entrenamiento!";
  }catch(e){ est.textContent = "No se pudo enviar. Revisá tu internet y probá de nuevo."; }
}

/* ================= Navegación y arranque ================= */
function render(){
  $("tEd").setAttribute("aria-selected", modo==="ed"); $("tAl").setAttribute("aria-selected", modo==="al");
  $("marca").textContent = S.marca || MARCA_DEFAULT;
  $("title").textContent = modo==="al" ? (S.titulo||"Tu rutina") : "Rutinas del Profe";
  $("eyebrow").textContent = modo==="al" ? ("Programa de entrenamiento" + (S.alumno?" · "+S.alumno:"")) : "Armado de rutinas";
  const y = window.scrollY;
  $("view").innerHTML = modo==="ed" ? vistaEditor() : (S.blocks.length ? vistaAlumno() : '<p class="note">La rutina todavía no tiene ejercicios.</p>');
  window.scrollTo(0,y);
}
function go(m){ modo = m; abierto = null; render(); window.scrollTo(0,0); }

document.addEventListener("change", ev=>{
  const el = ev.target, d = el.dataset; if(modo!=="ed") return;
  if(d.f){ S[d.f] = el.value.trim(); guardar(); if(d.f==="titulo"||d.f==="alumno") return; return; }
  if(d.b!=null && d.k){
    const b = S.blocks[+d.b], t = d.e!=null ? b.ex[+d.e] : b;
    let v = el.type==="checkbox" ? el.checked : el.value.trim();
    if(d.k==="series"){ v = Math.max(1,Math.min(10,parseInt(v,10)||1)); b.revisar = false; }
    t[d.k] = v;
    if(d.k==="n" && d.e!=null && !t.f){ t.f = buscarArchivo(v); }
    guardar(); render();
  }
});

(async function(){
  const hash = location.hash;
  await cargarArchivos();
  let m;
  if(hash.startsWith("#c=") || hash.startsWith("#z=") || hash.startsWith("#r=")){   // el alumno abre su link
    $("tabs").classList.add("hide"); modo = "al";
    $("view").innerHTML = '<p class="note">Cargando tu rutina...</p>';
    try{
      if((m = hash.match(/^#c=([a-z0-9]+)(?:@(.+))?$/))){
        const base = PLANILLA_URL || (m[2] ? urlDeploy(m[2]) : "");
        const r = await fetch(base + "?id=" + m[1]); const j = await r.json();
        if(!j.ok) throw 0;
        S = desdePayload(j.data); S.url = base;
      } else if(hash.startsWith("#z=")){
        const ds = new DecompressionStream("deflate-raw"), w = ds.writable.getWriter();
        w.write(unb64u(hash.slice(3))); w.close();
        S = desdePayload(JSON.parse(new TextDecoder().decode(await bytesDe(ds.readable))));
      } else { S = desdePayload(dec(hash.slice(3))); }
      document.title = (S.marca||MARCA_DEFAULT) + " · " + (S.titulo||"Tu rutina");
      render();
    }catch(e){ $("view").innerHTML = '<p class="note">No pude abrir esta rutina. Pedile a tu coach que te mande el link de nuevo.</p>'; }
    return;
  }
  reemparejar(true); render();
})();
</script>
